[tools]
# CI's runner has no tmux; on a Mac, tmux stays the user's own (decision 33).
"aqua:tmux/tmux-builds" = { version = "latest", os = ["linux"] }
"github:vladopajic/go-test-coverage" = "latest"
go = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
golangci-lint = "latest"
jactionlint = "latest"
shellcheck = "latest"

[tasks.fmt]
description = "Format the Go code (gofumpt, golines)"
run = "golangci-lint fmt"

[tasks."fmt:check"]
description = "Fail if any Go file is not formatted"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "Lint the Go code (golangci-lint)"
run = [
    "golangci-lint config verify",
    "golangci-lint run",
]

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows (jactionlint, shellcheck)"
run = "jactionlint --shellcheck=shellcheck"

[tasks.test]
description = "Run the Go tests with the race detector and write coverage.out"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.cover]
description = "Fail if test coverage is below the thresholds (go-test-coverage)"
depends = ["test"]
run = "go-test-coverage --config=.testcoverage.yml"

[tasks.vuln]
description = "Scan the dependencies for known vulnerabilities (govulncheck)"
run = "govulncheck ./..."

[tasks.dist]
description = "Build baton for Apple silicon into dist/, in an archive with the licenses of its code"
shell = "bash -c"
run = '''
set -euo pipefail
rm -rf dist
mkdir dist
CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/baton .

# Go's license, for its runtime and standard library, then that of each module built in.
notice() {
  printf '%s %s\n\n' "$1" "$2"
  cat "$3"
  printf '\n'
}
{
  printf 'baton is built with Go and the modules below, under the licenses that follow.\n\n'
  notice Go "$(go env GOVERSION)" "$(go env GOROOT)/LICENSE"
  go version -m dist/baton | awk '$1 == "dep" { print $2, $3 }' |
    while read -r module release; do
      dir=$(go mod download -json "${module}@${release}" | awk -F'"' '$2 == "Dir" { print $4 }')
      notice "${module}" "${release}" "${dir}/LICENSE"
    done
} >dist/THIRD_PARTY_LICENSES
cp LICENSE dist/

version=$(go version -m dist/baton | awk '$1 == "mod" { print $3 }')
# macOS's tar would add an AppleDouble file for each file's extended attributes.
COPYFILE_DISABLE=1 tar -czf "dist/baton-${version}-darwin-arm64.tar.gz" -C dist baton LICENSE \
  THIRD_PARTY_LICENSES
'''

[tasks.check]
description = "Run the local quality gate"
depends = ["fmt:check", "lint", "lint:actions", "cover", "vuln", "dist"]

[tasks.sonar-issues]
description = "List open SonarQube Cloud issues"
usage = '''
arg "[pr]" help="Pull request number; without it, the issues on main"
'''
shell = "bash -c"
run = '''
set -euo pipefail
api="https://sonarcloud.io/api"
key=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
target="project '${key}'"
scope=""
if [[ -n "${usage_pr+set}" ]]; then
  if [[ ! "${usage_pr}" =~ ^[1-9][0-9]*$ ]]; then
    echo "error: pull request must be a positive integer, got '${usage_pr}'" >&2
    exit 1
  fi
  target+=", pull request '${usage_pr}'"
  scope="&pullRequest=${usage_pr}"
fi

if ! curl -sSf "${api}/components/show?component=${key}${scope}" >/dev/null; then
  echo "error: cannot read SonarQube Cloud ${target}" >&2
  exit 1
fi

curl -sSf "${api}/issues/search?componentKeys=${key}&resolved=false&ps=200${scope}" |
  jq -r --arg key "${key}" '
    [.issues[] | {
      impacts: ([.impacts[] | "\(.softwareQuality):\(.severity)"] | sort | join(",")),
      rule,
      path: (.component | ltrimstr($key + ":")),
      line: (.line // 0),
      message
    }]
    | sort_by(.path, .line)[]
    | "\(.impacts)\t\(.rule)\t\(.path)\tL\(.line)\t\(.message)"'
'''
