name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go alone: the job can publish a release, so it installs no linter.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go
          cache: false

      - name: Build for Apple silicon, with the licenses
        env:
          MISE_AUTO_INSTALL: "false"
        run: mise run dist

      - name: Check that the version is the tag
        shell: bash
        run: |
          version=$(go version -m dist/baton | awk '$1 == "mod" { print $3 }')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::baton's version is '$version', the tag is '$GITHUB_REF_NAME'"
            exit 1
          fi

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --verify-tag --generate-notes "dist/baton-$GITHUB_REF_NAME-darwin-arm64.tar.gz"
